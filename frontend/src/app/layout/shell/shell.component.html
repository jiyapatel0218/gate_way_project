<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="shell-sidenav">
    <div class="brand">
      <mat-icon>apartment</mat-icon>
      <span>GreenGate</span>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      <span class="spacer"></span>

      <button mat-icon-button [matMenuTriggerFor]="notifMenu">
        <mat-icon [matBadge]="unreadCount() > 0 ? unreadCount() : null" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
      </button>
      <mat-menu #notifMenu="matMenu" class="notif-menu">
        <div class="notif-header" (click)="$event.stopPropagation()">
          <span>Notifications</span>
          <button mat-button (click)="markAllRead()">Mark all read</button>
        </div>
        <mat-divider></mat-divider>
        @if (notifications().length === 0) {
          <div class="notif-empty">No notifications yet</div>
        }
        @for (n of notifications().slice(0, 8); track n.id) {
          <button mat-menu-item (click)="openNotification(n.id)" [class.unread]="!n.isRead">
            <div class="notif-item">
              <b>{{ n.title }}</b>
              <span>{{ n.message }}</span>
            </div>
          </button>
        }
      </mat-menu>

      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info">
          <b>{{ currentUser()?.fullName }}</b>
          <span>{{ currentUser()?.role }}</span>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="shell-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
