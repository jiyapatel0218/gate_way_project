<div class="admin-login-page">
  <a [routerLink]="['/welcome']" class="back-to-roles">
    <mat-icon inline>arrow_back</mat-icon>
    Back
  </a>

  <mat-card class="admin-card">
    <h2>Sign In</h2>

    <form (ngSubmit)="submit()" #adminLoginForm="ngForm">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" required email autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" name="password" [(ngModel)]="password" required autocomplete="current-password" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }

      <button mat-flat-button color="primary" type="submit" class="full-width submit-btn" [disabled]="loading() || !adminLoginForm.form.valid">
        @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          <span>Sign In</span>
        }
      </button>

      <a [routerLink]="['/forgot-password']" class="forgot-link">Forgot password?</a>
    </form>
  </mat-card>
</div>
