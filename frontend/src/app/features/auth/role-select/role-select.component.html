<div class="min-h-screen w-full flex flex-col items-center justify-center px-6 py-16 bg-gradient-to-br from-emerald-950 via-emerald-800 to-teal-700 relative overflow-hidden">
  <div class="pointer-events-none absolute -top-24 -left-24 w-96 h-96 bg-emerald-400/30 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 w-96 h-96 bg-teal-300/30 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute top-1/3 right-1/4 w-72 h-72 bg-lime-300/10 rounded-full blur-3xl"></div>

  <div class="relative z-10 text-center mb-12">
    <div class="inline-flex items-center gap-2 text-white/80 text-sm font-medium tracking-wide mb-3">
      <mat-icon inline>apartment</mat-icon>
      <span>Society Gateway</span>
    </div>
    <h1 class="text-4xl md:text-5xl font-bold text-white mb-3">Welcome to Society Gateway</h1>
    <p class="text-white/70 text-lg">Select your role to continue.</p>
  </div>

  <div class="relative z-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl" style="perspective: 1000px;">
    @for (r of roles; track r.role) {
      <button
        #cardEl
        type="button"
        matRipple
        [matRippleColor]="'rgba(255,255,255,0.25)'"
        (mousemove)="onCardMouseMove($event, cardEl)"
        (mouseleave)="onCardMouseLeave(cardEl)"
        (click)="selectRole(r.role)"
        class="role-card relative flex flex-col items-center text-center gap-3 rounded-3xl border border-white/20 bg-white/10 backdrop-blur-xl p-8 shadow-xl transition-shadow duration-300 hover:shadow-2xl hover:border-white/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60"
      >
        <span class="text-5xl">{{ r.emoji }}</span>
        <h3 class="text-xl font-semibold text-white">{{ r.title }}</h3>
        <p class="text-sm text-white/70">{{ r.description }}</p>
      </button>
    }
  </div>
</div>
